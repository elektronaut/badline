name: CI
on:
  push:
    branches:
      - main
  pull_request:
# A new push to a pull request cancels its run in progress. Each push to
# main runs on its own, so release.yml sees every one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # The Spinel commit the suites and the native badline build with. Bumping
  # it rebuilds the cached compiler. release.yml reads it from here.
  SPINEL_REF: fffb1864ade8686aceb75c1ad814f763d9f4e5b4
jobs:
  # A pull request that changes only docs, or only what release-please
  # bumps for a release, can't move a spec or a suite, so the jobs after
  # Rubocop skip it. Pushes to main always run everything, so release.yml
  # sees every one.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - name: Check what changed
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          code=$(echo "$files" | grep -Ev '(\.md|^doc/.*|^\.release-please-manifest\.json|^lib/badline/version\.rb|^Gemfile\.lock)$' || true)
          lock=$(git diff "$BASE"...HEAD -- Gemfile.lock | grep -E '^[-+] ' | grep -Ev '^[-+] +badline \(' || true)
          if [ -n "$code" ] || [ -n "$lock" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs or a release's version bump changed, so the specs and suites skip it."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check code
        run: bundle exec rubocop
      - name: Check the Spinel subset
        run: bundle exec rspec spec/spinel_subset_spec.rb

  # The spec files split into shards by their recorded run times
  # (bin/spec_shard), plain and :slow, each shard a job of its own. The
  # :slow examples are left out of a plain `rspec` to keep the local loop
  # fast. A sharded run skips spec_helper's coverage floor, so each plain
  # shard keeps its SimpleCov results for the Coverage job.
  rspec:
    name: "RSpec (${{ matrix.kind }} ${{ matrix.shard }}/${{ matrix.shards }})"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: plain, shard: 1, shards: 2 }
          - { kind: plain, shard: 2, shards: 2 }
          - { kind: slow, shard: 1, shards: 2 }
          - { kind: slow, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run tests
        env:
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          if [ "$KIND" = slow ]; then
            mapfile -t files < <(bin/spec_shard --slow "$SHARD" "$SHARDS")
            options=(--tag slow)
          else
            mapfile -t files < <(bin/spec_shard "$SHARD" "$SHARDS")
            options=()
          fi
          printf '%s\n' "${files[@]}"
          bundle exec rspec "${options[@]}" --format progress --format json --out "tmp/rspec-$KIND-$SHARD.json" \
            "${files[@]}"
      # The times `bin/spec_shard --record` takes, from every shard of a run.
      - name: Keep the run times
        uses: actions/upload-artifact@v7
        with:
          name: spec-times-${{ matrix.kind }}-${{ matrix.shard }}
          path: tmp/rspec-${{ matrix.kind }}-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Keep the coverage
        if: matrix.kind == 'plain'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/.resultset.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The plain shards' coverage merged, held to the 90% floor a whole
  # `bundle exec rspec` run is held to.
  coverage:
    name: Coverage
    needs: rspec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: tmp/coverage
      - name: Check the coverage
        run: |
          bundle exec ruby -e 'require "simplecov"
            SimpleCov.collate(Dir["tmp/coverage/*/.resultset.json"]) { minimum_coverage 90 }'

  minitest:
    name: Minitest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Cache 65x02 test fixtures
        uses: actions/cache@v6
        with:
          path: vendor/65x02
          key: 65x02-fixtures-6502-v1
      - name: Run tests
        run: bundle exec rake test

  # Builds the compiler once, so the jobs below restore it instead of each
  # building it on a cold cache.
  compiler:
    name: Spinel compiler
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Locate Spinel
        run: echo "SPINEL_DIR=$HOME/spinel" >> "$GITHUB_ENV"
      - name: Cache Spinel
        id: spinel-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SPINEL_DIR }}
          key: spinel-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}
      - name: Build Spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --filter=blob:none https://github.com/matz/spinel "$SPINEL_DIR"
          git -C "$SPINEL_DIR" checkout --quiet "$SPINEL_REF"
          make -C "$SPINEL_DIR" deps
          make -C "$SPINEL_DIR" -j"$(nproc)"
      - name: Print the Spinel version
        run: '"$SPINEL_DIR/bin/spinel" --version'

  # Builds the native badline and runs it headless for a few frames, then
  # does the same with the spin pack tarball release.yml ships to Homebrew.
  native:
    name: Native badline
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Locate Spinel
        run: echo "SPINEL_DIR=$HOME/spinel" >> "$GITHUB_ENV"
      - name: Restore Spinel
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPINEL_DIR }}
          key: spinel-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}
          fail-on-cache-miss: true
      - name: Build the native badline
        run: SPINEL="$SPINEL_DIR/bin/spinel" bundle exec rake native:build
      - name: Run it headless
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          tmp/native/badline --version
          tmp/native/badline --frames 150 --unpaced --screenshot tmp/native/ready.bmp
      - name: Save and restore a snapshot
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          tmp/native/badline --frames 150 --unpaced --save-snapshot tmp/native/ready.vsf 2> tmp/native/save.err
          tmp/native/badline tmp/native/ready.vsf --frames 50 --unpaced --save-snapshot tmp/native/again.vsf \
            --screenshot tmp/native/restored.bmp 2> tmp/native/restore.err
          cat tmp/native/save.err tmp/native/restore.err
          test ! -s tmp/native/save.err && test ! -s tmp/native/restore.err
          bundle exec ruby --yjit -Ilib -e '
            require "badline"
            saved = Badline::Snapshot.load("tmp/native/ready.vsf")
            again = Badline::Snapshot.load("tmp/native/again.vsf")
            (again.cycles - saved.cycles).times { saved.cycle! }
            ours = Badline::Checkpoint.take(saved)
            theirs = Badline::Checkpoint.take(again)
            abort "the restored native machine ran on differently: #{ours.differences(theirs)}" unless ours == theirs
            [saved, again].each do |machine|
              machine.sid.catch_up!
              machine.sid.voices.each { |voice| voice.waveform.output }
            end
            ours = saved.snapshot
            theirs = again.snapshot
            unless ours == theirs
              first = ours.values.each_index.find { |i| ours.values[i] != theirs.values[i] }
              abort "the restored native machine holds another state than the CRuby machine, from value #{first.inspect}"
            end
            puts "restored and ran on to cycle #{again.cycles} as CRuby does"'
      # Saved 200 frames in, the true drive is loading the program the
      # machine autostarts, with its motor running.
      - name: Save and restore a snapshot with the true drive
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          bundle exec ruby -Ilib -e '
            require "badline"
            require "./spec/support/blank_disk"
            require "./spec/support/snapshot_scenarios"
            include BlankDisk
            blank_d64("tmp/native/demo.d64")
            program = SnapshotScenarios::DEMO_PRG + Array.new(6000) { |i| i & 0xff }
            Badline::Storage::D64Image.new("tmp/native/demo.d64").write_file("DEMO", program)'
          tmp/native/badline tmp/native/demo.d64 --true-drive --frames 200 --unpaced \
            --save-snapshot tmp/native/drive.vsf 2> tmp/native/drive-save.err
          tmp/native/badline tmp/native/drive.vsf --frames 100 --unpaced \
            --save-snapshot tmp/native/drive-again.vsf 2> tmp/native/drive-restore.err
          cat tmp/native/drive-save.err tmp/native/drive-restore.err
          test ! -s tmp/native/drive-save.err && test ! -s tmp/native/drive-restore.err
          bundle exec ruby --yjit -Ilib -e '
            require "badline"
            saved = Badline::Snapshot.load("tmp/native/drive.vsf")
            again = Badline::Snapshot.load("tmp/native/drive-again.vsf")
            abort "the snapshot has no true drive" unless saved.drive1541 && again.drive1541
            abort "the drive was not loading when saved" unless saved.drive1541.mechanism.motor_on?
            (again.cycles - saved.cycles).times { saved.cycle! }
            ours = Badline::Checkpoint.take(saved)
            theirs = Badline::Checkpoint.take(again)
            abort "the restored native machine ran on differently: #{ours.differences(theirs)}" unless ours == theirs
            drive = ->(machine) { [machine.drive1541.cpu.program_counter, machine.drive1541.cycles,
                                   machine.drive1541.bus.ram.read(0, 0x800)] }
            abort "the restored native drive ran on differently" unless drive.call(saved) == drive.call(again)
            puts "restored mid-load and ran on to cycle #{again.cycles} with the drive as CRuby does"'
      # The C128 typing print 6*7 on its VIC-IIe, then running a BASIC
      # loop that sets up the VDC's raster with a solid cursor, and showing
      # its 80 columns. Both builds must draw the same pictures.
      - name: Run the C128 as badline-ruby does
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          cat > tmp/native/c128.script <<'SCRIPT'
          130:type=print 6*7\n
          150:screenshot=tmp/native/c128-vic.bmp
          151:type=1 fori=0to12:readr,v:poke54784,r:poke54785,v:next\n
          175:type=2 data0,126,1,80,2,102,3,72,4,38,6,25,7,32,9,7,22,120,25,7,26,240,10,0,11,8\n
          200:type=run\n
          215:display=vdc
          225:screenshot=tmp/native/c128-vdc.bmp
          SCRIPT
          tmp/native/badline c128 --unpaced --no-sound --frames 225 --script tmp/native/c128.script
          mv tmp/native/c128-vic.bmp tmp/native/c128-vic-native.bmp
          mv tmp/native/c128-vdc.bmp tmp/native/c128-vdc-native.bmp
          bundle exec ruby --yjit exe/badline-ruby c128 --unpaced --frames 225 --script tmp/native/c128.script
          cmp tmp/native/c128-vic-native.bmp tmp/native/c128-vic.bmp
          cmp tmp/native/c128-vdc-native.bmp tmp/native/c128-vdc.bmp
      - name: Save and restore a C128 snapshot
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          tmp/native/badline c128 --model c128dcr --frames 150 --unpaced --at '130:type=poke53296,1\n' \
            --save-snapshot tmp/native/c128.vsf 2> tmp/native/c128-save.err
          tmp/native/badline tmp/native/c128.vsf --frames 50 --unpaced \
            --save-snapshot tmp/native/c128-again.vsf 2> tmp/native/c128-restore.err
          cat tmp/native/c128-save.err tmp/native/c128-restore.err
          test ! -s tmp/native/c128-save.err && test ! -s tmp/native/c128-restore.err
          bundle exec ruby --yjit -Ilib -e '
            require "badline"
            saved = Badline::Snapshot.load("tmp/native/c128.vsf")
            again = Badline::Snapshot.load("tmp/native/c128-again.vsf")
            abort "the snapshot is no C128DCR" unless saved.model.name == "c128dcr" && again.model.name == "c128dcr"
            saved.run_cycles(again.cycles - saved.cycles)
            ours = Badline::Checkpoint.take(saved)
            theirs = Badline::Checkpoint.take(again)
            abort "the restored native C128 ran on differently: #{ours.differences(theirs)}" unless ours == theirs
            [saved, again].each do |machine|
              machine.sid.catch_up!
              machine.sid.voices.each { |voice| voice.waveform.output }
            end
            ours = saved.snapshot
            theirs = again.snapshot
            unless ours == theirs
              first = ours.values.each_index.find { |i| ours.values[i] != theirs.values[i] }
              abort "the restored native C128 holds another state than the CRuby one, from value #{first.inspect}"
            end
            puts "restored the C128 and ran on to cycle #{again.cycles} as CRuby does"'
      - name: Upload the screenshot
        uses: actions/upload-artifact@v7
        with:
          name: native-badline
          path: |
            tmp/native/ready.bmp
            tmp/native/restored.bmp
            tmp/native/c128-vic.bmp
            tmp/native/c128-vdc.bmp
          if-no-files-found: ignore
      - name: Pack the native badline
        run: |
          SPINEL="$SPINEL_DIR/bin/spinel" bundle exec rake native:pack
          echo "VERSION=$(ruby -r ./lib/badline/version -e 'print Badline::VERSION')" >> "$GITHUB_ENV"
          echo "TARBALL=$(ls tmp/native/badline-*-spinel-*.tar.gz)" >> "$GITHUB_ENV"
      - name: Build and run the pack
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir "$RUNNER_TEMP/check"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/check"
          cd "$RUNNER_TEMP/check/badline-$VERSION"
          make -j"$(nproc)"
          export BADLINE_ROM_PATH="$PWD/roms"
          ./badline --version
          ./badline --unpaced --no-sound --frames 150 --screenshot ready.bmp

  # Every regression suite on the Spinel build, each compared against its
  # baseline in test/baselines/. The shards are balanced by recent run
  # times to about 10 minutes each. testbench-irqdma is split by filter,
  # testbench-drive by filter into its viavarious rows and the rest, and
  # lorenz by stretch. A runner has 2 cores with 2 threads each, so a
  # Lorenz stretch runs nearly twice as fast beside one other as beside
  # three.
  suites:
    name: "Suites (${{ matrix.shard }})"
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lorenz-1-2
            harnesses: lorenz
            tasks: spinel:lorenz[1,2]
          - shard: lorenz-3-4
            harnesses: lorenz
            tasks: spinel:lorenz[3,4]
          - shard: irqdma-1
            harnesses: testbench
            tasks: spinel:testbench[testbench-irqdma,b.prg]
          - shard: irqdma-2
            harnesses: testbench
            tasks: >-
              spinel:testbench[testbench-irqdma,test1.prg,test2.prg,test3.prg,test4.prg,test5.prg,test6.prg,test7.prg]
          - shard: cia
            harnesses: testbench
            tasks: spinel:testbench[testbench-cia]
          - shard: cia-new
            harnesses: testbench
            tasks: spinel:testbench[testbench-cia-new]
          - shard: expansions
            harnesses: testbench
            tasks: >-
              spinel:testbench[testbench-expansions]
              spinel:testbench[testbench-vicii-new]
              spinel:testbench[testbench-general]
              spinel:testbench[testbench-interrupts]
              spinel:testbench[testbench-ntsc-cia-new]
          - shard: vicii-cpu
            harnesses: testbench
            tasks: spinel:testbench[testbench] spinel:testbench[testbench-cpu]
          - shard: sid-ntsc
            harnesses: testbench sidtests boot cpu_tests vic20_boot c128_boot
            tasks: >-
              spinel:sidtests[6581]
              spinel:sidtests[8580]
              spinel:check
              spinel:testbench[testbench-ntsc]
              spinel:testbench[testbench-ntsc-vicii-new]
              spinel:testbench[testbench-drean]
              spinel:testbench[testbench-carts]
          - shard: drive-via-1
            harnesses: testbench
            tasks: >-
              spinel:testbench[testbench-drive,via1.prg,via2.prg,via3,via4.prg,via5.prg,via9.prg]
          - shard: drive-via-2
            harnesses: testbench
            tasks: >-
              spinel:testbench[testbench-drive,via10,via11,via12,via13,via14,via20,via21]
          - shard: drive
            harnesses: testbench drive_scenarios vic20_testbench
            tasks: >-
              spinel:testbench[testbench-drive,!viavarious]
              spinel:drive_scenarios
              spinel:testbench[testbench-vic20]
          - shard: c128c64
            harnesses: c128_testbench
            tasks: spinel:testbench[testbench-c128c64]
          - shard: c128
            harnesses: c128_testbench
            tasks: spinel:testbench[testbench-c128]
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Locate Spinel
        run: |
          echo "SPINEL_DIR=$HOME/spinel" >> "$GITHUB_ENV"
          echo "SHARDS=$(nproc)" >> "$GITHUB_ENV"
          printf '| Step | Time |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Spinel
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPINEL_DIR }}
          key: spinel-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}
          fail-on-cache-miss: true
      - name: Put Spinel on PATH
        run: echo "$SPINEL_DIR/bin" >> "$GITHUB_PATH"
      - name: Cache 65x02 test fixtures
        if: contains(matrix.harnesses, 'cpu_tests')
        uses: actions/cache@v6
        with:
          path: vendor/65x02
          key: 65x02-fixtures-6502-v1
      - name: Cache VICE-testprogs
        uses: actions/cache@v6
        with:
          path: vendor/VICE-testprogs
          key: vice-testprogs-v1
      - name: Check out the vendored suites
        run: bundle exec rake vendor:VICE-testprogs
      # The rake tasks build their own harnesses. Building them here once
      # for the shard, SPINEL=true below makes each task's build a no-op
      # that leaves these binaries in place.
      - name: Build the harnesses
        env:
          HARNESSES: ${{ matrix.harnesses }}
        run: |
          start=$SECONDS
          bundle exec ruby -r ./spinel/check -e 'SpinelCheck.build("spinel", harnesses: ENV["HARNESSES"].split)'
          echo "| Build $HARNESSES | $((SECONDS - start)) s |" >> "$GITHUB_STEP_SUMMARY"
      # The testbench, SID and drive scenario tasks run SHARDS processes, set
      # to the core count, and spinel:lorenz runs its stretches side by side. A task
      # that fails leaves the next to run, and the step fails at the end.
      - name: Run the suites
        env:
          SPINEL: "true"
          TASKS: ${{ matrix.tasks }}
        run: |
          set -f
          status=0
          for task in $TASKS; do
            start=$SECONDS
            bundle exec rake "$task" || status=1
            echo "| $task | $((SECONDS - start)) s |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Upload run artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suites-${{ matrix.shard }}
          path: |
            tmp/spinel/*.out
            tmp/spinel/*.txt
            tmp/regression
            tmp/testbench
          if-no-files-found: ignore

  # One check that passes only when every job above passed or was
  # skipped for a change that can't move it, so the required checks don't
  # have to follow the shards as they are rebalanced.
  ci:
    name: CI
    needs: [changes, rubocop, rspec, coverage, minitest, compiler, native, suites]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  automerge:
    name: Auto-merge Dependabot
    needs: ci
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
