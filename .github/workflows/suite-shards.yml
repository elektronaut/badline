name: Suite shards
# The suites on the Spinel build, each compared against its baseline in
# test/baselines/, over the matrix `rake ci:matrix` derives. ci.yml calls it
# for the suites a pull request reaches and for the Spinel checks on a push
# to main, and suites.yml for every suite on its schedule.
on:
  workflow_call:
    inputs:
      matrix:
        description: "The matrix `rake ci:matrix[compact]` printed"
        required: true
        type: string
      harnesses:
        description: "The harnesses the matrix runs, a JSON array as `rake ci:harnesses` prints it"
        required: true
        type: string
      spinel-ref:
        description: "The Spinel commit to build with"
        required: true
        type: string
      max-parallel:
        description: "How many shards run at once"
        required: false
        type: number
        default: 64
permissions:
  contents: read
jobs:
  spinel:
    name: Spinel compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPINEL_REF: ${{ inputs.spinel-ref }}
    steps:
      - name: Locate Spinel
        run: echo "SPINEL_DIR=$HOME/spinel" >> "$GITHUB_ENV"
      - name: Cache Spinel
        id: spinel-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SPINEL_DIR }}
          key: spinel-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}
      - name: Build Spinel
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --filter=blob:none https://github.com/matz/spinel "$SPINEL_DIR"
          git -C "$SPINEL_DIR" checkout --quiet "$SPINEL_REF"
          make -C "$SPINEL_DIR" deps
          make -C "$SPINEL_DIR" -j"$(nproc)"

  # Each harness the shards run, built once in a job of its own and cached
  # on its name, the Spinel commit and a hash of every source Spinel reads.
  # The job hands the binary on as an artifact of the run, and each shard
  # downloads the ones it runs rather than building its own. Only binaries
  # are cached, never a suite's verdict.
  harnesses:
    name: "Harness (${{ matrix.harness }})"
    needs: spinel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(inputs.harnesses) }}
    env:
      SPINEL_REF: ${{ inputs.spinel-ref }}
      HARNESS: ${{ matrix.harness }}
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Cache the harness
        id: cache
        uses: actions/cache@v6
        with:
          path: tmp/spinel/${{ matrix.harness }}
          key: >-
            harness-${{ matrix.harness }}-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}-${{
            hashFiles('lib/**', 'spinel/**', 'test/support/**') }}
      - uses: ./.github/actions/setup
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Locate Spinel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "SPINEL_DIR=$HOME/spinel" >> "$GITHUB_ENV"
          echo "$HOME/spinel/bin" >> "$GITHUB_PATH"
      - name: Restore Spinel
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPINEL_DIR }}
          key: spinel-${{ runner.os }}-${{ runner.arch }}-${{ env.SPINEL_REF }}
          fail-on-cache-miss: true
      - name: Build the harness
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          start=$SECONDS
          bundle exec ruby -r ./spinel/check -e 'SpinelCheck.build("spinel", harnesses: [ENV.fetch("HARNESS")])'
          printf '| Step | Time |\n| --- | --- |\n| Build %s | %d s |\n' "$HARNESS" "$((SECONDS - start))" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Hand the harness on
        uses: actions/upload-artifact@v7
        with:
          name: harness-${{ matrix.harness }}
          path: tmp/spinel/${{ matrix.harness }}
          retention-days: 1
          if-no-files-found: error

  # The shards are balanced by recent run times to about 10 minutes each.
  # testbench-irqdma is split by filter, testbench-drive by filter into its
  # viavarious rows and the rest, drive-scenarios into the PET's drives and
  # the rest, and lorenz and lorenz-plus4 by stretch.
  # A runner has 2 cores with 2 threads each, so a Lorenz stretch runs
  # nearly twice as fast beside one other as beside three.
  suites:
    name: "Suites (${{ matrix.shard }})"
    needs: harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: ./.github/actions/setup
      - name: Count the cores
        run: |
          echo "SHARDS=$(nproc)" >> "$GITHUB_ENV"
          printf '| Step | Time |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
      # The artifact pattern names the shard's harnesses, in braces when
      # there are several.
      - name: Pick the harnesses
        id: pick
        env:
          HARNESSES: ${{ matrix.harnesses }}
        run: |
          read -ra names <<< "$HARNESSES"
          if [ "${#names[@]}" -eq 1 ]; then
            echo "pattern=harness-${names[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "pattern=harness-{$(IFS=,; echo "${names[*]}")}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the harnesses
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.pick.outputs.pattern }}
          path: tmp/spinel
          merge-multiple: true
      - name: Make the harnesses executable
        env:
          HARNESSES: ${{ matrix.harnesses }}
        run: for harness in $HARNESSES; do chmod +x "tmp/spinel/$harness"; done
      - name: Cache 65x02 test fixtures
        if: contains(matrix.harnesses, 'cpu_tests')
        uses: actions/cache@v6
        with:
          path: vendor/65x02
          key: 65x02-fixtures-6502-v1
      - name: Cache Z80 test sample
        if: contains(matrix.harnesses, 'z80_tests')
        uses: actions/cache@v6
        with:
          path: vendor/z80-sample
          key: z80-sample-ebe1875d-100
      - name: Cache 6809 test vectors
        if: contains(matrix.harnesses, 'm6809_tests')
        uses: actions/cache@v6
        with:
          path: vendor/m6809
          key: m6809-vectors-9dd7b592
      - name: Cache VICE-testprogs
        uses: actions/cache@v6
        with:
          path: vendor/VICE-testprogs
          key: vice-testprogs-v1
      - name: Check out the vendored suites
        run: bundle exec rake vendor:VICE-testprogs
      # The testbench, SID and drive scenario tasks run SHARDS processes, set
      # to the core count, and spinel:lorenz runs its stretches side by side. A task
      # that fails leaves the next to run, and the step fails at the end.
      - name: Run the suites
        env:
          # Each spinel:* task builds its harnesses first, running the
          # compiler SPINEL names. /bin/true as the compiler exits 0 and
          # prints nothing, so SpinelCheck.build counts each harness as
          # built and leaves the restored binaries in place.
          SPINEL: "true"
          TASKS: ${{ matrix.tasks }}
          SUITES_MOVED: tmp/moved/moved.jsonl
        run: |
          set -f
          mkdir -p tmp/moved
          status=0
          for task in $TASKS; do
            start=$SECONDS
            bundle exec rake "$task" || status=1
            echo "| $task | $((SECONDS - start)) s |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      # The rows that moved, which suites.yml names in its suites-red issue.
      - name: Upload the moved rows
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: moved-${{ matrix.shard }}
          path: tmp/moved/moved.jsonl
          if-no-files-found: ignore
      - name: Upload run artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suites-${{ matrix.shard }}
          path: |
            tmp/spinel/*.out
            tmp/spinel/*.txt
            tmp/regression
            tmp/testbench
          if-no-files-found: ignore
