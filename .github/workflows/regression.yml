name: Regression
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        default: all
        options:
          - all
          - testbench
          - lorenz
          - lorenz-1
          - lorenz-2
          - lorenz-3
          - lorenz-4
          - sid
          - testbench-cia
          - testbench-interrupts
          - testbench-irqdma
          - testbench-cpu
          - testbench-carts
          - testbench-cia-new
          - sid-8580
# No concurrency group: nothing here cancels anything, so a nightly run and
# a dispatched one never touch each other.
permissions:
  actions: read
  contents: read
jobs:
  # "all" is the nightly set; the testbench-* and sid-8580 suites are
  # opt-in and only run when asked for by name. The nightly run skips when
  # nothing a suite can see has changed since the last successful nightly
  # run. The compare API lists at most 300 files, so a list that long counts
  # as changed.
  select:
    name: Select suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.suite || 'all' }}
        run: |
          if [ "$REQUESTED" = all ]; then
            suites='["testbench","lorenz","sid"]'
          else
            suites="[\"$REQUESTED\"]"
          fi
          if [ "$EVENT" = schedule ]; then
            last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow regression.yml \
              --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            if [ -n "$last" ]; then
              changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA" \
                --jq 'if (.files | length) >= 300 then "lib/" else .files[].filename end' |
                grep -E '^(lib/|bin/(lorenz|sidtests|testbench)$|test/baselines/|test/(regression|lorenz_chain|lorenz_run|sidtests_machine|forked_boot|testbench_machine|testbench_engine)\.rb$|Rakefile$|\.github/workflows/regression\.yml$)' ||
                true)
              if [ -z "$changed" ]; then
                echo "Nothing the suites run changed since $last. Skipping."
                suites='[]'
              fi
            fi
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
  regression:
    name: "Regression (${{ matrix.suite }})"
    needs: select
    if: needs.select.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - uses: ruby/setup-ruby@v1.324.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Cache VICE-testprogs
        uses: actions/cache@v4
        with:
          path: vendor/VICE-testprogs
          key: vice-testprogs-v1
      - name: Diff against the tracked baseline
        run: bundle exec rake regression:${{ matrix.suite }}
      - name: Upload run artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.suite }}
          path: |
            tmp/regression
            tmp/testbench
            tmp/lorenz
          if-no-files-found: ignore
