name: Regression
on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "bin/lorenz"
      - "bin/sidtests"
      - "bin/testbench"
      - "test/baselines/**"
      - "Rakefile"
      - ".github/workflows/regression.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        default: all
        options:
          - all
          - testbench
          - lorenz
          - sid
          - testbench-cia
          - testbench-interrupts
          - testbench-irqdma
          - testbench-cpu
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # "all" is the push-to-main set; the testbench-* suites are long enough
  # that they only run when asked for by name.
  select:
    name: Select suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - id: pick
        env:
          REQUESTED: ${{ inputs.suite || 'all' }}
        run: |
          if [ "$REQUESTED" = all ]; then
            suites='["testbench","lorenz","sid"]'
          else
            suites="[\"$REQUESTED\"]"
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
  regression:
    name: "Regression (${{ matrix.suite }})"
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - uses: ruby/setup-ruby@v1.324.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Cache VICE-testprogs
        uses: actions/cache@v4
        with:
          path: vendor/VICE-testprogs
          key: vice-testprogs-v1
      - name: Diff against the tracked baseline
        run: bundle exec rake regression:${{ matrix.suite }}
      - name: Upload run artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.suite }}
          path: |
            tmp/regression
            tmp/testbench
            tmp/lorenz
          if-no-files-found: ignore
