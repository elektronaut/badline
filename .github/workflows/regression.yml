name: Regression
# The suites on CRuby, started by hand from the Actions tab. CI runs them
# on the Spinel build; this checks that CRuby agrees, for instance after
# SPINEL_REF moves a long way.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        default: all
        options:
          - all
          - testbench
          - lorenz
          - lorenz-1
          - lorenz-2
          - lorenz-3
          - lorenz-4
          - sid
          - testbench-cia
          - testbench-interrupts
          - testbench-irqdma
          - testbench-cpu
          - testbench-carts
          - testbench-cia-new
          - testbench-vicii-new
          - testbench-general
          - testbench-expansions
          - testbench-ntsc
          - testbench-ntsc-vicii-new
          - testbench-ntsc-cia-new
          - testbench-drean
          - testbench-vic20
          - testbench-c128c64
          - sid-8580
          - drive-scenarios
# No concurrency group: nothing here cancels anything, so two dispatched
# runs never touch each other.
permissions:
  contents: read
jobs:
  # "all" is the testbench, lorenz and sid suites.
  select:
    name: Select suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - id: pick
        env:
          REQUESTED: ${{ inputs.suite }}
        run: |
          if [ "$REQUESTED" = all ]; then
            suites='["testbench","lorenz","sid"]'
          else
            suites="[\"$REQUESTED\"]"
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
  regression:
    name: "Regression (${{ matrix.suite }})"
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.select.outputs.suites) }}
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Cache VICE-testprogs
        uses: actions/cache@v6
        with:
          path: vendor/VICE-testprogs
          key: vice-testprogs-v1
      - name: Diff against the tracked baseline
        run: bundle exec rake regression:${{ matrix.suite }}
      - name: Upload run artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.suite }}
          path: |
            tmp/regression
            tmp/testbench
            tmp/lorenz
          if-no-files-found: ignore
