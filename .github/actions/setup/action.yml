name: Set up Ruby
description: >-
  Installs the apt packages a job needs, then Ruby 4.0 with the bundle
  installed and cached. A local action loads from the checkout, so a job
  checks out before it uses this.
inputs:
  apt-packages:
    description: "Packages to apt-get install, or none when empty"
    default: libsdl2-2.0-0
runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.apt-packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y $PACKAGES
    - uses: ruby/setup-ruby@v1.327.0
      with:
        ruby-version: "4.0"
        bundler-cache: true
