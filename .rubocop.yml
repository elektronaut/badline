---
plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0

Metrics/AbcSize:
  Max: 60
  Exclude:
    - "lib/badline/instruction.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/ClassLength:
  Max: 240
  Exclude:
    - "lib/badline/instruction.rb"
    - "lib/badline/vic.rb"

Metrics/CollectionLiteralLength:
  Exclude:
    - "lib/badline/instruction.rb"

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/MethodLength:
  Max: 48
  Exclude:
    - "lib/badline/instruction.rb"

Metrics/ModuleLength:
  Max: 130

Metrics/PerceivedComplexity:
  Max: 10

RSpec/IndexedLet:
  # joystick1/joystick2 are the hardware's own names for the control ports.
  AllowedIdentifiers:
    - joystick1
    - joystick2

Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  AutoCorrect: true
  Max: 120

Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned
