---
plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0

Metrics/AbcSize:
  Max: 64
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/ClassLength:
  Max: 240
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"
    - "lib/badline/chips/vic.rb"

Metrics/CollectionLiteralLength:
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"

Metrics/CyclomaticComplexity:
  Max: 21

Metrics/MethodLength:
  Max: 50
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"

Metrics/ModuleLength:
  Max: 210

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 8

RSpec/IndexedLet:
  # joystick1/joystick2 are the hardware's own names for the control ports.
  AllowedIdentifiers:
    - joystick1
    - joystick2

Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  AutoCorrect: true
  Max: 120

Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned

RSpec/SpecFilePathFormat:
  # Chips::VICI lives in chips/vic_i.rb.
  CustomTransform:
    VICI: vic_i
