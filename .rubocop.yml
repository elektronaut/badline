---
plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-rspec

inherit_from:
  - .rubocop_todo.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0

Metrics/AbcSize:
  Exclude:
    - "lib/badline/instruction.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/ClassLength:
  Exclude:
    - "lib/badline/instruction.rb"
    - "lib/badline/vic.rb"

Metrics/MethodLength:
  Exclude:
    - "lib/badline/instruction.rb"

RSpec/IndexedLet:
  # joystick1/joystick2 are the hardware's own names for the control ports.
  AllowedIdentifiers:
    - joystick1
    - joystick2

Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  AutoCorrect: true
  Max: 120

Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned
