---
plugins:
  - rubocop-minitest
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0

# PET#initialize wires the whole board, the true drive and the SuperPET's
# check among it.
Metrics/AbcSize:
  Max: 66
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/ClassLength:
  Max: 244
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"
    - "lib/badline/chips/vic.rb"

Metrics/CollectionLiteralLength:
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"

Metrics/CyclomaticComplexity:
  Max: 21

Metrics/MethodLength:
  Max: 50
  Exclude:
    - "lib/badline/chips/cpu/instruction.rb"

# Options::Validation checks every family's options, the SuperPET's --cpu
# and --bank-ram among them.
Metrics/ModuleLength:
  Max: 216

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 9

RSpec/IndexedLet:
  # joystick1/joystick2 are the hardware's own names for the control ports.
  AllowedIdentifiers:
    - joystick1
    - joystick2

Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  AutoCorrect: true
  Max: 120

Layout/MultilineOperationIndentation:
  EnforcedStyle: aligned

RSpec/SpecFilePathFormat:
  # Chips::VICI lives in chips/vic_i.rb, and PET::SuperPET in pet/superpet.rb.
  CustomTransform:
    VICI: vic_i
    SuperPET: superpet
